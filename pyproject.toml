[project]
name = "aigc-video-studio"
version = "0.1.0"
description = "面向生产环境的多模态营销视频生成平台"
readme = "README.md"
authors = [
    { name = "wenqing12359", email = "3169747436@qq.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
]

[project.scripts]
aigc-video-studio = "aigc_video_studio.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
